services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  redis-insight:
    image: redis/redisinsight:latest
    profiles: ["tools"]
    ports:
      - "5540:5540"

volumes:
  redis-data:
